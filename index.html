<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVBox 配置编辑器</title>
    <style>
        :root {
            --bg: #0f1119; --surface: #1a1d2e; --surface2: #242736; --accent: #e94560;
            --text: #e0e0e0; --text2: #8b8fa3; --border: #2a2d3e; --hover: #2f3247;
            --input-bg: #161823; --success: #4caf84; --warning: #f0a040;
            --radius: 10px; --transition: 0.2s ease;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; min-height: 100vh; line-height: 1.6; }
        .app-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; position: sticky; top: 0; z-index: 100; }
        .app-header .logo { font-size: 1.2rem; font-weight: 700; background: linear-gradient(135deg, #ff6b6b, #feca57); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .app-header .actions { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: all var(--transition); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
        .btn:hover { background: var(--hover); border-color: var(--accent); }
        .btn-accent { background: var(--accent); color: #fff; border: none; }
        .btn-accent:hover { filter: brightness(1.2); }
        .btn-primary { background: #2d4f7c; color: #fff; border: none; }
        .btn-success { background: var(--success); color: #fff; border: none; }
        .btn-warning { background: var(--warning); color: #111; border: none; }
        .btn-sm { padding: 5px 10px; font-size: 0.75rem; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 20px; background: var(--surface); border-radius: var(--radius); padding: 4px; overflow-x: auto; }
        .tab { padding: 10px 16px; border: none; background: transparent; color: var(--text2); cursor: pointer; border-radius: 6px; font-size: 0.85rem; font-weight: 500; transition: all var(--transition); white-space: nowrap; }
        .tab:hover { color: #fff; background: var(--hover); }
        .tab.active { background: var(--accent); color: #fff; font-weight: 600; }
        .panel { display: none; }
        .panel.active { display: block; }
        .card { background: var(--surface); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; border: 1px solid var(--border); }
        .card h3 { margin-bottom: 14px; font-size: 1rem; color: #fff; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .badge { background: var(--accent); color: #fff; font-size: 0.7rem; padding: 3px 8px; border-radius: 10px; font-weight: 400; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 0.8rem; color: var(--text2); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--input-bg); color: #ddd; font-size: 0.85rem; font-family: monospace; transition: border var(--transition); }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(233,68,96,0.15); }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
        .item-list { list-style: none; }
        .item-list li { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 8px; cursor: pointer; transition: all var(--transition); }
        .item-list li:hover { border-color: var(--accent); background: #2a2e42; }
        .item-list li.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(233,68,96,0.2); }
        .item-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .tag { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: 500; background: #3a2a50; color: #c0a0e0; }
        .empty-state { text-align: center; padding: 20px; color: var(--text2); }
        .code-area textarea { background: #0a0b12; color: #c0d0e0; border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; width: 100%; min-height: 450px; font-family: monospace; font-size: 0.8rem; line-height: 1.7; resize: vertical; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--success); color: #111; padding: 12px 24px; border-radius: 20px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 200; }
        .toast.show { opacity: 1; }
        .mt-2 { margin-top: 12px; } .text-sm { font-size: 0.8rem; } .text-muted { color: var(--text2); }
        .group-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 12px; }
        .group-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
        .group-title { font-weight: 600; font-size: 1rem; color: #fff; min-width: 120px; display: flex; align-items: center; gap: 6px; }
        .group-title input { width: 160px; padding: 4px 8px; border-radius: 4px; border: 1px solid var(--accent); background: var(--input-bg); color: #fff; font-size: 0.9rem; }
        .channel-item { background: #1e2032; border-radius: 6px; padding: 10px; margin-bottom: 8px; display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
        .channel-name-input { flex: 1; min-width: 150px; }
        .urls-container { flex: 3; display: flex; flex-direction: column; gap: 4px; }
        .url-row { display: flex; gap: 4px; align-items: center; }
        .inline-rule-editor { background: var(--surface2); border-radius: 8px; padding: 15px; margin-bottom: 12px; }
    </style>
</head>
<body>
<div class="app-header">
    <span class="logo">⚙️ TVBox 配置编辑器 Pro</span>
    <span class="text-sm text-muted"> · </span>
    <div class="actions">
        <button class="btn btn-primary" id="btn-visual" onclick="switchMode('visual')">📋 可视化</button>
        <button class="btn" id="btn-source" onclick="switchMode('source')">📝 源码</button>
        <button class="btn btn-success" onclick="copyConfig()">📋 一键复制</button>
        <button class="btn" onclick="saveConfig()">💾 保存</button>
        <button class="btn btn-warning" onclick="clearAll()">🗑️ 清空</button>
    </div>
</div>

<div class="container">
    <div id="visual-mode" class="mode active">
        <div class="tabs" id="config-tabs">
            <button class="tab active" data-panel="sites-panel">📡 点播源</button>
            <button class="tab" data-panel="lives-panel">📺 直播源</button>
            <button class="tab" data-panel="parses-panel">🔍 解析地址</button>
            <button class="tab" data-panel="vip-flags-panel">⭐ VIP解析</button>
            <button class="tab" data-panel="ijk-panel">🎬 IJK解码</button>
            <button class="tab" data-panel="ads-panel">🚫 广告过滤</button>
            <button class="tab" data-panel="wallpaper-panel">🖼️ 壁纸</button>
            <button class="tab" data-panel="spider-panel">🕷️ 爬虫</button>
            <button class="tab" data-panel="recommend-panel">🌟 推荐接口</button>
        </div>

        <!-- 点播源面板 -->
        <div id="sites-panel" class="panel active">
            <div class="card">
                <h3>📡 点播源 <span class="badge" id="sites-count">0</span></h3>
                <ul class="item-list" id="sites-list"></ul>
                <button class="btn btn-accent btn-sm mt-2" onclick="addSite()">＋ 添加点播源</button>
            </div>
            <div class="card" id="site-editor-card" style="display:none;">
                <h3 id="site-editor-title">编辑点播源</h3>
                <div class="form-row">
                    <div class="form-group"><label>Key</label><input id="site-key" placeholder="如: csp_Yours"></div>
                    <div class="form-group"><label>Name</label><input id="site-name" placeholder="如: 微笑影视"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Type</label><select id="site-type"><option value="0">0 - XML</option><option value="1" selected>1 - JSON</option><option value="2">2 - 爬虫源</option><option value="3">3 - CSP</option><option value="4">4 - 服务器爬虫</option></select></div>
                    <div class="form-group"><label>可搜索</label><select id="site-searchable"><option value="1">可</option><option value="0">否</option></select></div>
                    <div class="form-group"><label>快速搜索</label><select id="site-quicksearch"><option value="0">否</option><option value="1">可</option></select></div>
                </div>
                <div class="form-group"><label>Api</label><input id="site-api" placeholder="接口地址"></div>
                <div class="form-group"><label>PlayUrl</label><input id="site-playurl" placeholder="播放地址(可选)"></div>
                <div class="form-group"><label>扩展信息 (Ext JSON)</label><textarea id="site-ext" rows="2" placeholder='{"分类url":"https://.../{cateId}-{catePg}.html"}'></textarea></div>
                <div class="form-group"><label>分类 (逗号分隔)</label><input id="site-categories" placeholder="电影,电视剧"></div>
                <div class="mt-2">
                    <button class="btn btn-success btn-sm" onclick="saveSite()">💾 保存</button>
                    <button class="btn btn-sm" onclick="cancelEditSite()">取消</button>
                    <button class="btn btn-warning btn-sm" id="btn-delete-site" style="display:none;" onclick="deleteSite()">🗑️ 删除</button>
                </div>
            </div>
        </div>

        <!-- 直播源面板 -->
        <div id="lives-panel" class="panel">
            <div class="card">
                <h3>📺 直播源 <span class="badge" id="lives-count">0</span></h3>
                <div class="form-row" style="margin-bottom:12px; align-items:center;">
                    <input id="new-group-name" placeholder="输入新分组名称" style="flex:1;">
                    <button class="btn btn-accent btn-sm" onclick="addLiveGroup()">＋ 添加分组</button>
                </div>
                <div id="lives-container"></div>
            </div>
        </div>

        <!-- 解析地址面板 -->
        <div id="parses-panel" class="panel">
            <div class="card">
                <h3>🔍 解析地址 <span class="badge" id="parses-count">0</span></h3>
                <ul class="item-list" id="parses-list"></ul>
                <button class="btn btn-accent btn-sm mt-2" onclick="addParse()">＋ 添加解析</button>
            </div>
            <div class="card" id="parse-editor-card" style="display:none;">
                <h3 id="parse-editor-title">编辑解析</h3>
                <div class="form-row">
                    <div class="form-group"><label>Name</label><input id="parse-name" placeholder="如: 虾米解析"></div>
                    <div class="form-group"><label>Type</label><select id="parse-type"><option value="0">0 - 普通</option><option value="1">1 - JSON</option><option value="2">2 - 多JSON</option><option value="3">3 - 聚合</option></select></div>
                    <div class="form-group"><label>Url</label><input id="parse-url" placeholder="https://jx.xmflv.com/?url="></div>
                </div>
                <div class="form-group"><label>ParseExt (支持的平台)</label><input id="parse-ext" placeholder="youku,qq,iqiyi,letv,sohu"></div>
                <div class="mt-2">
                    <button class="btn btn-success btn-sm" onclick="saveParse()">💾 保存</button>
                    <button class="btn btn-sm" onclick="cancelEditParse()">取消</button>
                    <button class="btn btn-warning btn-sm" id="btn-delete-parse" style="display:none;" onclick="deleteParse()">🗑️ 删除</button>
                </div>
            </div>
        </div>

        <!-- VIP解析标识 -->
        <div id="vip-flags-panel" class="panel">
            <div class="card">
                <h3>⭐ VIP解析标识</h3>
                <div class="form-group"><label>Flags (逗号分隔)</label><input id="flags-input"></div>
                <button class="btn btn-success btn-sm" onclick="saveFlags()">💾 保存</button>
            </div>
        </div>

        <!-- IJK解码 -->
        <div id="ijk-panel" class="panel">
            <div class="card"><h3>🎬 IJK解码</h3></div>
            <div class="card"><h4>软解码</h4><div id="ijk-soft-fields"></div><button class="btn btn-accent btn-sm mt-2" onclick="addIjkField('soft')">＋ 参数</button></div>
            <div class="card"><h4>硬解码</h4><div id="ijk-hard-fields"></div><button class="btn btn-accent btn-sm mt-2" onclick="addIjkField('hard')">＋ 参数</button></div>
        </div>

        <!-- 广告过滤 -->
        <div id="ads-panel" class="panel">
            <div class="card"><h3>🚫 广告过滤</h3></div>
            <div class="card">
                <h3>屏蔽域名列表</h3>
                <ul class="item-list" id="ads-list"></ul>
                <div class="mt-2" style="display:flex;gap:8px;">
                    <input id="ad-domain-input" placeholder="输入域名" style="flex:1;">
                    <button class="btn btn-accent btn-sm" onclick="addAdDomain()">＋ 添加</button>
                </div>
            </div>
            <div class="card">
                <h3>过滤规则</h3>
                <ul class="item-list" id="rules-list"></ul>
                <button class="btn btn-accent btn-sm mt-2" onclick="startAddRule()">＋ 添加规则</button>
                <button class="btn btn-sm mt-2" onclick="resetAdsToDefault()">🔄 重置默认</button>
            </div>
        </div>

        <!-- 壁纸/爬虫 -->
        <div id="wallpaper-panel" class="panel">
            <div class="card"><h3>🖼️ 壁纸</h3><div class="form-group"><label>API</label><input id="wallpaper-url"></div><button class="btn btn-success btn-sm" onclick="saveWallpaper()">💾 保存</button></div>
        </div>
        <div id="spider-panel" class="panel">
            <div class="card"><h3>🕷️ 爬虫</h3><div class="form-group"><label>JAR</label><input id="spider-jar"></div><button class="btn btn-success btn-sm" onclick="saveSpider()">💾 保存</button></div>
        </div>

        <!-- 推荐接口 -->
        <div id="recommend-panel" class="panel">
            <div class="card"><h3>🌟 推荐成熟接口</h3></div>
            <div class="card"><h4>📡 点播源</h4><ul class="item-list" id="recommend-sites-list"></ul></div>
            <div class="card"><h4>📺 直播源</h4><ul class="item-list" id="recommend-lives-list"></ul></div>
        </div>
    </div>

    <!-- 源码模式 -->
    <div id="source-mode" class="mode" style="display:none;">
        <div class="card"><h3>📝 源码编辑</h3></div>
        <div class="code-area"><textarea id="source-editor" spellcheck="false"></textarea></div>
        <div class="mt-2" style="display:flex;gap:10px;">
            <button class="btn btn-success" onclick="applySource()">✅ 应用源码</button>
            <button class="btn btn-accent" onclick="formatSource()">💄 格式化</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

    // ==================== 工具函数 ====================
    function esc(str) {
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function toast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        clearTimeout(t._timer);
        t._timer = setTimeout(() => t.classList.remove('show'), 2000);
    }

    function deepMerge(target, source) {
        for (let k in source) {
            if (source[k] && typeof source[k] === 'object' && !Array.isArray(source[k])) {
                if (!target[k]) target[k] = {};
                deepMerge(target[k], source[k]);
            } else target[k] = source[k];
        }
        return target;
    }

    function generateJSON() {
        const out = {};
        if (config.spider) out.spider = config.spider;
        if (config.wallpaper) out.wallpaper = config.wallpaper;
        if (config.ads.length) out.ads = config.ads.slice();
        if (config.rules.length) out.rules = config.rules.map(r => ({name:r.name, hosts:r.hosts||[], regex:r.regex||[]}));
        if (config.sites.length) out.sites = config.sites.map(s => {
            const o = { key:s.key, name:s.name, type:s.type, api:s.api, searchable:s.searchable };
            if (s.quickSearch) o.quickSearch = s.quickSearch;
            if (s.filterable) o.filterable = s.filterable;
            if (s.playUrl) o.playUrl = s.playUrl;
            if (s.ext && s.ext !== '') o.ext = s.ext;
            if (s.categories && s.categories.length) o.categories = s.categories;
            return o;
        });
        if (config.lives.length) out.lives = config.lives.map(g => ({
            group: g.group,
            channels: (g.channels||[]).map(c => ({ name:c.name, urls: c.urls||[''] }))
        }));
        if (config.parses.length) out.parses = config.parses.map(p => {
            const o = { name:p.name, type:p.type, url:p.url };
            if (p.ext) o.ext = p.ext;
            return o;
        });
        if (config.flags.length) out.flags = config.flags.slice();
        out.ijk = {
            soft: config.ijk.soft.map(f => ({ ...f })),
            hard: config.ijk.hard.map(f => ({ ...f }))
        };
        return JSON.stringify(out, null, 2);
    }

    // ==================== 一键复制（修复版） ====================
    window.copyConfig = function() {
        const text = generateJSON();
        // 优先使用现代 Clipboard API，失败后回退到 execCommand
        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(text).then(() => {
                toast('📋 已复制到剪贴板');
            }).catch(() => {
                fallbackCopy(text);
            });
        } else {
            fallbackCopy(text);
        }
    };

    function fallbackCopy(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        textarea.style.top = '0';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        try {
            const success = document.execCommand('copy');
            if (success) {
                toast('📋 已复制到剪贴板');
            } else {
                toast('⚠️ 复制失败，请手动复制源码');
            }
        } catch (err) {
            toast('⚠️ 复制失败，请手动复制源码');
        }
        document.body.removeChild(textarea);
    }

        config.rules = DEFAULT.rules.map(r => ({name:r.name, hosts:r.hosts.slice(), regex:r.regex.slice()}));
        renderAds(); renderRules(); updateSourceEditor();
        toast('🔄 已重置为默认规则');
    };

    function renderWallpaper() { document.getElementById('wallpaper-url').value = config.wallpaper || ''; }
    window.saveWallpaper = function() { config.wallpaper = document.getElementById('wallpaper-url').value.trim(); updateSourceEditor(); toast('✅ 壁纸已保存'); };

    function renderSpider() { document.getElementById('spider-jar').value = config.spider || ''; }
    window.saveSpider = function() { config.spider = document.getElementById('spider-jar').value.trim(); updateSourceEditor(); toast('✅ 爬虫配置已保存'); };

    // 推荐接口
    function renderRecommend() {
        document.getElementById('recommend-sites-list').innerHTML = RECOMMEND_SITES.map((s,i) => `
            <li>
                <div class="item-header"><span>${esc(s.name)}</span><button class="btn btn-accent btn-sm" onclick="importRecSite(${i})">导入</button></div>
                <div class="text-sm text-muted">${esc(s.api)}</div>
            </li>`).join('');
        document.getElementById('recommend-lives-list').innerHTML = RECOMMEND_LIVES.map((g,i) => `
            <li>
                <div class="item-header"><span>${esc(g.group)}</span><button class="btn btn-accent btn-sm" onclick="importRecLive(${i})">导入</button></div>
                <div class="text-sm text-muted">${g.channels.length}个频道</div>
            </li>`).join('');
    }
    window.importRecSite = function(i) {
        const s = RECOMMEND_SITES[i];
        if (config.sites.some(x => x.key === s.key)) {
            toast('⚠️ 该点播源已存在');
            return;
        }
        config.sites.push({...s, categories:[], ext:'', quickSearch:0, filterable:0, playUrl:''});
        renderSites(); updateSourceEditor(); toast('✅ 已导入 ' + s.name);
    };
    window.importRecLive = function(i) {
        const clone = JSON.parse(JSON.stringify(RECOMMEND_LIVES[i]));
        clone.channels.forEach(c => { if (!c.urls) c.urls = ['']; });
        config.lives.push(clone);
        renderLives(); updateSourceEditor(); toast('✅ 已导入直播分组');
    };

    // 源码模式操作
    window.applySource = function() {
        try {
            const parsed = JSON.parse(document.getElementById('source-editor').value);
            config = deepMerge(JSON.parse(JSON.stringify(DEFAULT)), parsed);
            refreshAll();
            toast('✅ 源码已应用');
        } catch (e) {
            toast('❌ JSON 格式错误，请检查');
        }
    };

    window.formatSource = function() {
        try {
            const obj = JSON.parse(document.getElementById('source-editor').value);
            document.getElementById('source-editor').value = JSON.stringify(obj, null, 2);
        } catch (e) {
            toast('❌ 无法格式化，JSON 无效');
        }
    };

    // Tab 切换
    document.getElementById('config-tabs').addEventListener('click', function(e) {
        const tab = e.target.closest('.tab');
        if (!tab) return;
        document.querySelectorAll('#config-tabs .tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        const panel = document.getElementById(tab.dataset.panel);
        if (panel) panel.classList.add('active');
    });

    // 启动
    loadConfig();
    refreshAll();
</script>
</body>
</html>
